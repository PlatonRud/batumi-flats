<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Квартиры Батуми — карта аренды</title>

  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- iOS: запуск с домашнего экрана без интерфейса Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Батуми">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="preload" href="fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <div id="map" class="map"></div>

    <!-- Вкладка «Список» -->
    <section id="list" class="list" hidden>
      <ul id="list-items" class="cards"></ul>
      <p id="list-empty" class="empty" hidden>По этим фильтрам ничего не найдено</p>
    </section>

    <!-- Фильтры поверх карты и списка -->
    <header id="top" class="top">
      <div id="types" class="chips" role="group" aria-label="Тип квартиры"></div>
      <div id="prices" class="chips" role="group" aria-label="Цена"></div>
      <p id="status" class="status" aria-live="polite">Загрузка…</p>
    </header>

    <nav id="tabbar" class="glass tabbar" aria-label="Разделы">
      <button id="nav-map" class="tab" type="button">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.100 7-11.500A7 7 0 0 0 5 9.500C5 14.900 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
        <span class="tab-label">Карта</span>
      </button>
      <button id="nav-list" class="tab" type="button">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.500 6h.010M4.500 12h.010M4.500 18h.010"/></svg>
        <span class="tab-label">Список</span>
      </button>
    </nav>

    <!-- Квартиры выбранного дома -->
    <aside id="sheet" class="sheet" hidden>
      <div class="sheet-head">
        <div class="sheet-heading">
          <h2 id="sheet-title" class="sheet-title"></h2>
          <p id="sheet-note" class="sheet-note"></p>
        </div>
        <button id="sheet-close" class="glass glass-btn" type="button" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul id="sheet-items" class="cards"></ul>
    </aside>

    <!-- Фото квартиры на весь экран -->
    <section id="gallery" class="gallery" hidden>
      <div id="gallery-track" class="gallery-track"></div>
      <button id="gallery-close" class="glass glass-btn gallery-close" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <span id="gallery-count" class="glass gallery-count"></span>
    </section>

    <!-- Пост Telegram с полным описанием -->
    <section id="viewer" class="viewer" hidden>
      <header class="bar">
        <button id="viewer-back" class="glass glass-btn" type="button" aria-label="Назад">
          <svg viewBox="0 0 28 28" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.500 21l-7-7 7-7"/></svg>
        </button>
        <h1 id="viewer-title" class="bar-title"></h1>
        <span></span>
      </header>
      <div id="viewer-body" class="viewer-body"></div>
      <footer class="viewer-actions">
        <a id="viewer-post" class="btn btn-secondary" target="_blank" rel="noopener">Открыть в Telegram</a>
        <a id="viewer-realtor" class="btn btn-primary" target="_blank" rel="noopener">Написать риелтору</a>
      </footer>
    </section>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
